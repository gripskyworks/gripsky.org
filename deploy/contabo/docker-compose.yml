services:
  site:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: gripsky-site
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      GRIPSKY_DB_PATH: /app/data/gripsky.sqlite
      LOCAL_EMAIL_PREVIEW: "false"
    volumes:
      - ./data:/app/data
    networks:
      - gripsky-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: nginx:1.29-alpine
    container_name: gripsky-web
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    volumes:
      - ./nginx-gripsky-org.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gripsky-net
    healthcheck:
      test:
        - CMD
        - nginx
        - -t
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  gripsky-net:
    external: true
